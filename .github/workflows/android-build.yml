name: NeoCanvas Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew
      - name: Verify Android repository boundary
        shell: pwsh
        run: ./scripts/verify-android-repository.ps1
      - name: Run Android unit tests and assemble debug APK
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:assembleDebug
